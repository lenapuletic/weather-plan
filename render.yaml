# Optional: deploy server/api-proxy.mjs to Render (https://render.com)
# Create a new Web Service from this repo; Render can pick up this file or use:
#   Build: (none)
#   Start: node server/api-proxy.mjs
# Env: GEMINI_API_KEY, OPENWEATHER_API_KEY, ALLOW_ORIGINS

services:
  - type: web
    name: weather-plan-api-proxy
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: node server/api-proxy.mjs
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: ALLOW_ORIGINS
        sync: false
